services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser01}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword01}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sxr_leetlab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-myuser01}:${POSTGRES_PASSWORD:-mypassword01}@postgres:5432/${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a long random value}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CLIENT_URL: http://localhost:5173
      JUDGE0_API_URL: ${JUDGE0_API_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://127.0.0.1:8000/api/v1/health\").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

  seed:
    build: ./backend
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-myuser01}:${POSTGRES_PASSWORD:-mypassword01}@postgres:5432/${POSTGRES_DB:-postgres}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "db:seed"]

volumes:
  sxr_leetlab_postgres_data:
